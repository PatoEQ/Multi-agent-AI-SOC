[project]
name = "soc-sentinel-crew"
version = "0.1.0"
description = "Autonomous multi-agent SOC pipeline (CrewAI) with a binding AI auditor gate."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
authors = [{ name = "PatoEQ" }]

[project.urls]
Repository = "https://github.com/PatoEQ/soc-sentinel-crew"
Issues = "https://github.com/PatoEQ/soc-sentinel-crew/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["tests/stubs"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "S"]
ignore = [
  "E501",   # long prompt strings are intentional
  "S101",   # assert is fine in tests
  "S603",   # subprocess call with validated, fixed argv (suricata -T)
  "UP007",  # keep Optional[...] readable for beginners
  "UP045",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "B023"]
